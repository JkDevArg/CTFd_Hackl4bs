{% extends "base.html" %}

{% block content %}
  <div class="jumbotron">
    <div class="container">
      <h1>
        {% trans %}Challenges{% endtrans %}
      </h1>
    </div>
  </div>

  <style>
    .challenge-button {
      position: relative;
      border: 1px solid #30363d !important;
      background: #161b22 !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 12px !important;
      overflow: hidden;
    }

    .challenge-button:hover {
      transform: translateY(-5px);
      border-color: #58a6ff !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .challenge-solved {
      opacity: 0.8;
      background: #0d1117 !important;
      border-color: #238636 !important;
      box-shadow: inset 0 0 10px rgba(35, 134, 54, 0.2);
    }

    .challenge-solved::after {
      content: "✓";
      position: absolute;
      top: 10px;
      right: 15px;
      color: #3fb950;
      font-weight: bold;
      font-size: 1.2rem;
      z-index: 2;
    }

    /* Hide the floating checkmark in list view */
    .list-view .challenge-solved::after {
      display: none;
    }

    .challenge-solved:hover {
      opacity: 1;
      border-color: #3fb950 !important;
      box-shadow: 0 0 15px rgba(63, 185, 80, 0.3) !important;
    }

    .challenge-button.tag-Easy, .challenge-button.tag-easy { border-bottom: 3px solid #00d4aa !important; }
    .challenge-button.tag-Medium, .challenge-button.tag-medium { border-bottom: 3px solid #f39c12 !important; }
    .challenge-button.tag-Hard, .challenge-button.tag-hard { border-bottom: 3px solid #e74c3c !important; }
    .challenge-button.tag-Insane, .challenge-button.tag-insane { border-bottom: 3px solid #9b59b6 !important; }

    .view-toggle-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 5px;
    }
    .view-toggle-btn:hover {
      background: #30363d;
      color: #f0f6fc;
    }
    .view-toggle-btn.active {
      background: #238636;
      color: white;
      border-color: #2ea043;
      box-shadow: 0 0 10px rgba(35, 134, 54, 0.4);
    }

    /* List View Styles */
    .list-view .challenges-row > div {
      width: 100% !important;
      max-width: 100% !important;
      flex: 0 0 100% !important;
    }
    .list-view .challenge-button {
      display: flex;
      align-items: center;
      text-align: left;
      padding: 10px 20px !important;
    }
    .list-view .challenge-inner {
      display: flex;
      width: 100%;
      align-items: center;
      margin: 0 !important;
    }
    .list-view .challenge-inner > div {
      margin-right: 20px !important;
      margin-bottom: 0 !important;
    }
    .list-view .challenge-inner p {
      flex-grow: 1;
      margin: 0 !important;
      font-size: 1.1rem;
    }
    .list-view .challenge-inner span {
      font-weight: bold;
      color: #8b949e;
      min-width: 50px;
      text-align: right;
    }
  </style>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div 
      x-data="{ ...ChallengeBoard(), viewMode: 'grid' }" 
      @load-challenges.window="loadChallenges()" 
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div class="row mb-4" x-show="loaded">
        <div class="col-12 d-flex justify-content-end">
          <div class="btn-group">
            <button class="view-toggle-btn" :class="viewMode === 'grid' ? 'active' : ''" @click="viewMode = 'grid'">
              <i class="fas fa-th-large"></i>
            </button>
            <button class="view-toggle-btn" :class="viewMode === 'list' ? 'active' : ''" @click="viewMode = 'list'">
              <i class="fas fa-list"></i>
            </button>
          </div>
        </div>
      </div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="pt-5">
            <div class="category-header mb-3">
              <h3 x-text="category"></h3>
            </div>

            <div class="category-challenges d-flex flex-column" :class="viewMode === 'list' ? 'list-view' : ''">
              <div class="challenges-row row">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div :class="viewMode === 'grid' ? 'col-sm-6 col-md-4 col-lg-3 my-3' : 'col-12 my-2'">
                    <button
                        class="challenge-button btn btn-dark w-100 h-100"
                        :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >

                      <div class="challenge-inner my-3">
                        <template x-if="c.tags.some(t => t.value.toLowerCase() === 'easy')">
                          <div class="mb-2"><i class="fas fa-leaf" style="color: #00d4aa; font-size: 1.8rem; filter: drop-shadow(0 0 5px #00d4aa);"></i> <div x-show="viewMode === 'grid'" style="color:#00d4aa; font-weight:bold; font-size:11px; text-transform:uppercase; margin-top:4px;">Easy</div></div>
                        </template>
                        <template x-if="c.tags.some(t => t.value.toLowerCase() === 'medium')">
                          <div class="mb-2"><i class="fas fa-fire" style="color: #f39c12; font-size: 1.8rem; filter: drop-shadow(0 0 5px #f39c12);"></i> <div x-show="viewMode === 'grid'" style="color:#f39c12; font-weight:bold; font-size:11px; text-transform:uppercase; margin-top:4px;">Medium</div></div>
                        </template>
                        <template x-if="c.tags.some(t => t.value.toLowerCase() === 'hard')">
                          <div class="mb-2"><i class="fas fa-skull" style="color: #e74c3c; font-size: 1.8rem; filter: drop-shadow(0 0 5px #e74c3c);"></i> <div x-show="viewMode === 'grid'" style="color:#e74c3c; font-weight:bold; font-size:11px; text-transform:uppercase; margin-top:4px;">Hard</div></div>
                        </template>
                        <template x-if="c.tags.some(t => t.value.toLowerCase() === 'insane')">
                          <div class="mb-2"><i class="fas fa-radiation" style="color: #9b59b6; font-size: 1.8rem; filter: drop-shadow(0 0 8px #9b59b6);"></i> <div x-show="viewMode === 'grid'" style="color:#9b59b6; font-weight:bold; font-size:11px; text-transform:uppercase; margin-top:4px;">Insane</div></div>
                        </template>
                        <p class="mt-1">
                          <span x-text="c.name"></span>
                          <template x-if="c.solved_by_me && viewMode === 'list'">
                            <i class="fas fa-check-circle ms-2 text-success"></i>
                          </template>
                        </p>
                        <span x-text="c.value"></span>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
